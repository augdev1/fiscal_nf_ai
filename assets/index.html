
    <!DOCTYPE html>
    <html lang="pt-BR">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/assets/logoai.ico">
        <title>FiscalIA Pro</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; overflow-x: hidden; }
          nav { position: fixed; top: 0; height: 80px; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid rgba(198,255,0,0.2); }
          .logo img { height: 80px; width: auto; }
          .logo:hover { opacity: 0.8; }
          .nav-info { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
          .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px 40px 60px; background: linear-gradient(135deg, #000 0%, #1a1a1a 100%); position: relative; overflow: hidden; }
          .hero-bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 20% 50%, rgba(198,255,0,0.1) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(198,255,0,0.05) 0%, transparent 50%); }
          .hero-content { position: relative; z-index: 1; text-align: center; max-width: 1200px; width: 100%; }
          .hero h1 { font-size: 80px; font-weight: 900; margin-bottom: 10px; background: linear-gradient(90deg, #fff 0%, #c6ff00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: fadeInUp 1s ease; }
          .hero .subtitle { font-size: 18px; color: #888; margin-bottom: 60px; text-transform: uppercase; letter-spacing: 3px; animation: fadeInUp 1.2s ease; }
          .upload-container { width: 100%; max-width: 900px; margin: 40px auto; animation: fadeInUp 1.4s ease; }
          .upload-area { border: 3px solid rgba(198,255,0,0.3); padding: 80px 40px; text-align: center; background: rgba(198,255,0,0.02); transition: all 0.3s ease; cursor: pointer; position: relative; }
          .upload-area:hover { border-color: #c6ff00; background: rgba(198,255,0,0.05); }
          .upload-area.dragover { border-color: #c6ff00; background: rgba(198,255,0,0.1); transform: scale(1.01); }
          .upload-icon { font-size: 80px; margin-bottom: 20px; filter: grayscale(100%); opacity: 0.6; transition: all 0.3s; }
          .upload-area:hover .upload-icon { filter: grayscale(0%); opacity: 1; }
          .upload-text { font-size: 24px; color: #fff; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
          .upload-subtext { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
          input[type="file"] { display: none; }
          .file-list { margin-top: 30px; padding: 0; }
          .file-item { display: flex; align-items: center; justify-content: space-between; padding: 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(198,255,0,0.2); margin-bottom: 10px; transition: all 0.3s; }
          .file-item:hover { background: rgba(198,255,0,0.05); border-color: #c6ff00; }
          .file-name { color: #fff; font-size: 14px; flex: 1; text-transform: uppercase; letter-spacing: 1px; }
          .file-size { color: #888; font-size: 12px; margin-right: 20px; text-transform: uppercase; }
          .remove-file { background: transparent; color: #c6ff00; border: 1px solid #c6ff00; padding: 8px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
          .remove-file:hover { background: #c6ff00; color: #000; }
          .btn { width: 100%; padding: 24px; font-size: 16px; font-weight: 700; border: 2px solid #c6ff00; background: transparent; color: #c6ff00; cursor: pointer; transition: all 0.3s ease; margin-top: 30px; text-transform: uppercase; letter-spacing: 2px; }
          .btn:hover:not(:disabled) { background: #c6ff00; color: #000; transform: translateY(-2px); }
          .btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #444; color: #444; }
          .loading { display: none; text-align: center; padding: 60px 20px; }
          .loading.active { display: block; }
          .spinner { border: 3px solid rgba(198,255,0,0.1); border-top: 3px solid #c6ff00; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
          .loading-text { color: #888; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
          .resultado-section { max-width: 1200px; margin: 60px auto; padding: 0 40px; }
          .resultado-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(198,255,0,0.2); padding: 60px 40px; animation: slideIn 0.5s ease; }
          .resultado-title { font-size: 36px; font-weight: 900; color: #c6ff00; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
          .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-bottom: 40px; }
          .stat-item { text-align: center; padding: 40px 20px; background: rgba(198,255,0,0.02); border: 1px solid rgba(198,255,0,0.2); transition: all 0.3s; }
          .stat-item:hover { background: rgba(198,255,0,0.05); border-color: #c6ff00; transform: translateY(-5px); }
          .stat-label { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 15px; letter-spacing: 2px; }
          .stat-value { font-size: 42px; font-weight: 900; color: #c6ff00; }
          .action-buttons { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
          .btn-download { background: transparent; border: 2px solid #c6ff00; color: #c6ff00; padding: 20px; text-decoration: none; display: block; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; }
          .btn-download:hover { background: #c6ff00; color: #000; transform: translateY(-2px); }
          .resumo-ia-card, .erros-card { margin-top: 40px; padding: 40px; background: rgba(255,255,255,0.02); border: 1px solid rgba(198,255,0,0.2); animation: slideIn 0.5s ease; }
          .resumo-ia-card h3, .erros-card h3 { color: #c6ff00; margin-bottom: 20px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
          .resumo-ia-card pre, .erros-list { white-space: pre-wrap; word-wrap: break-word; line-height: 1.8; color: #aaa; font-family: inherit; font-size: 16px; }
          .erros-list { list-style: none; padding: 0; }
          .erros-list li { background: rgba(255, 82, 82, 0.05); border-left: 3px solid #ff5252; padding: 10px 15px; margin-bottom: 10px; font-size: 14px; }
          .hidden { display: none; }
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
          @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
          @media (max-width: 768px) {
            .hero h1 { font-size: 48px; }
            nav { padding: 15px 20px; }
            .nav-info { display: none; }
            .upload-area { padding: 60px 20px; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
            .resultado-card, .resumo-ia-card, .erros-card { padding: 40px 20px; }
          }
        </style>
      </head>
      <body>
        <nav>
            <a href="/" class="logo"><img src="/assets/logoai.png" alt="Fiscal IA Pro"></a>
            <div class="nav-info">Análise Inteligente de NF-e</div>
        </nav>
        <section class="hero">
          <div class="hero-bg"></div>
          <div class="hero-content">
            <h1>FiscalIA Pro</h1>
            <div class="subtitle">Análise de NF-e com IA</div>
            <div class="upload-container">
              <form id="form-nfes" enctype="multipart/form-data">
                <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                  <div class="upload-icon">📁</div>
                  <div class="upload-text">Carregar Arquivos XML</div>
                  <div class="upload-subtext">Arraste ou clique para selecionar</div>
                  <input id="file-input" name="files" type="file" multiple accept=".xml" />
                </div>
                <div id="file-list" class="file-list hidden"></div>
                <button type="button" class="btn" id="btn-processar" onclick="enviar()" disabled>Gerar Relatório</button>
              </form>
            </div>
            <div class="loading" id="loading"><div class="spinner"></div><div class="loading-text">Processando...</div></div>
          </div>
        </section>
        <div class="resultado-section">
          <div id="resultado" class="hidden"></div>
          <div id="erros" class="hidden"></div>
          <div id="resumo-ia" class="hidden"></div>
        </div>
        <script>
        let selectedFiles = [];
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const btnProcessar = document.getElementById('btn-processar');

        ['dragover', 'dragleave', 'drop'].forEach(eventName => uploadArea.addEventListener(eventName, e => e.preventDefault()));
        uploadArea.addEventListener('dragover', () => uploadArea.classList.add('dragover'));
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
          uploadArea.classList.remove('dragover');
          handleFiles(Array.from(e.dataTransfer.files));
        });
        fileInput.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

        function handleFiles(files) {
          selectedFiles.push(...files.filter(f => f.type === 'text/xml' || f.name.toLowerCase().endsWith('.xml')));
          renderFileList();
          btnProcessar.disabled = selectedFiles.length === 0;
        }

        function renderFileList() {
          fileList.classList.toggle('hidden', selectedFiles.length === 0);
          fileList.innerHTML = selectedFiles.map((file, index) => `
            <div class="file-item">
              <span class="file-name">📄 ${file.name}</span>
              <span class="file-size">${(file.size / 1024).toFixed(1)} KB</span>
              <button type="button" class="remove-file" onclick="removeFile(${index})">Remover</button>
            </div>`).join('');
        }

        function removeFile(index) {
          selectedFiles.splice(index, 1);
          renderFileList();
          btnProcessar.disabled = selectedFiles.length === 0;
        }

        async function enviar() {
          const formData = new FormData();
          selectedFiles.forEach(file => formData.append('files', file));
          
          document.getElementById('loading').classList.add('active');
          ['resultado', 'resumo-ia', 'erros'].forEach(id => document.getElementById(id).classList.add('hidden'));
          btnProcessar.disabled = true;

          try {
            const resp = await fetch('/processar-nfes', { method: 'POST', body: formData });
            const data = await resp.json();

            if (resp.status === 400) {
              mostrarErros(data.erros, "Nenhuma nota foi processada.");
            } else if (resp.ok) {
              mostrarResultado(data);
              if (data.detalhes_erros && data.detalhes_erros.length > 0) {
                mostrarErros(data.detalhes_erros, "Algumas notas tiveram problemas:");
              }
            } else {
               alert('Erro: ' + (data.detail || 'Ocorreu um erro desconhecido no servidor.'));
            }
          } catch (error) {
            alert('Erro de conexão: ' + error.message);
          } finally {
            document.getElementById('loading').classList.remove('active');
            btnProcessar.disabled = false;
          }
        }

        function mostrarResultado(data) {
  const div = document.getElementById('resultado');
  div.classList.remove('hidden');
  div.innerHTML = `
    <div class="resultado-card">
      <h2 class="resultado-title">Relatório Gerado</h2>
      <p style="text-align:center; color: #aaa; margin-bottom: 30px;">${data.mensagem}</p>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">Sucessos</div>
          <div class="stat-value">${data.notas_processadas}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Geral</div>
          <div class="stat-value">R$ ${data.total_geral.toFixed(2)}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total ICMS</div>
          <div class="stat-value">R$ ${data.total_icms.toFixed(2)}</div>
        </div>
      </div>
      <div class="action-buttons">
        <a href="/download-relatorio?nome_arquivo=${encodeURIComponent(data.relatorio_excel)}" class="btn-download">Baixar Excel</a>
        <a href="/gerar-relatorio-pdf?nome_arquivo=${encodeURIComponent(data.relatorio_excel)}" class="btn-download" target="_blank">Gerar e Baixar PDF</a>
        <button type="button" class="btn" onclick="gerarResumoIA('${data.relatorio_excel}')">Análise com IA</button>
      </div>
    </div>`;
       
        } 

        async function gerarResumoIA(nomeArquivo) {
          document.getElementById('loading').classList.add('active');
          try {
            const resp = await fetch('/resumo-ia?nome_arquivo=' + encodeURIComponent(nomeArquivo));
            const data = await resp.json();
            if (resp.ok) {
              const resumoDiv = document.getElementById('resumo-ia');
              resumoDiv.classList.remove('hidden');
              resumoDiv.innerHTML = `<div class="resumo-ia-card"><h3>Análise IA</h3><pre>${data.resumo}</pre></div>`;
            } else {
              alert('Erro IA: ' + (data.detail || 'Não foi possível gerar o resumo.'));
            }
          } catch (error) {
            alert('Erro ao conectar com a IA: ' + error.message);
          } finally {
            document.getElementById('loading').classList.remove('active');
          }
        }
        </script>
      </body>
    </html>
